name: Python tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure Poppler is available for PDF integration tests
        run: command -v pdfinfo && command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Run tests
        run: python -m unittest discover -s tests -v
