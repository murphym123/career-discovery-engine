name: DC career discovery
on:
  workflow_dispatch:
    inputs:
      source_mode:
        type: choice
        description: "DC preserves the full unranked board audit; other modes use existing feeds/APIs"
        options: [dc, free, remotive, jobicy, muse, reliefweb, usajobs, brave, both]
        default: dc
        required: true
      experimental_ranking:
        type: boolean
        description: "DC only: add an EXPERIMENTAL, unvalidated shortlist beside the full audit"
        default: false
        required: true
      expanded_ats:
        type: boolean
        description: "DC only: regional source evidence, public ATS discovery, and separate broad exploration"
        default: false
        required: true
      ats_board_budget:
        type: number
        description: "Maximum discovered employer boards to poll (1–100), only if expanded_ats is enabled"
        default: 30
        required: true
      query_budget:
        type: number
        description: "Brave queries (1–20)"
        default: 6
        required: true
      extract_budget:
        type: number
        description: "Max public HTML pages to inspect (0–30; zero by default)"
        default: 0
        required: true
      source_pages:
        type: number
        description: "Max requests per added free API (1–20)"
        default: 6
        required: true
      allow_paid_search:
        type: boolean
        description: "Explicitly authorize possible Brave charges (leave false for free runs)"
        default: false
        required: true
      dc_detail_budget:
        type: number
        description: "Public detail pages per DC board (0–30); dc mode is an unranked source audit"
        default: 20
        required: true
      inspection_seed:
        type: number
        description: "Reproducible exploratory description sample (DC mode)"
        default: 0
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: dc-career-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Restore prior history when available
        if: inputs.source_mode != 'dc'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data output
          while read -r previous_id; do
            if gh run download "$previous_id" -R "$GITHUB_REPOSITORY" -n career-history -D data >/dev/null 2>&1; then
              echo "Restored history"
              exit 0
            fi
          done < <(gh run list --workflow discovery.yml --status success --limit 15 --json databaseId --jq '.[].databaseId')
          echo "No prior history artifact"
      - name: Restore ATS registry when expanded discovery is requested
        if: inputs.source_mode == 'dc' && inputs.expanded_ats
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data output
          while read -r previous_id; do
            if gh run download "$previous_id" -R "$GITHUB_REPOSITORY" -n public-ats-registry -D data >/dev/null 2>&1; then
              echo "Restored discovered ATS registry"
              exit 0
            fi
          done < <(gh run list --workflow discovery.yml --limit 15 --json databaseId --jq '.[].databaseId')
          echo "Starting ATS registry from public URL evidence"
      - name: Run discovery
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          MODE: ${{ inputs.source_mode }}
          BUDGET: ${{ inputs.query_budget }}
          EXTRACT_BUDGET: ${{ inputs.extract_budget }}
          SOURCE_PAGES: ${{ inputs.source_pages }}
          ALLOW_PAID_SEARCH: ${{ inputs.allow_paid_search }}
          DC_DETAIL_BUDGET: ${{ inputs.dc_detail_budget }}
          INSPECTION_SEED: ${{ inputs.inspection_seed }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUDGET" =~ ^[0-9]+$ ]] && (( BUDGET >= 1 && BUDGET <= 20 )) || exit 2
          [[ "$EXTRACT_BUDGET" =~ ^[0-9]+$ ]] && (( EXTRACT_BUDGET >= 0 && EXTRACT_BUDGET <= 30 )) || exit 2
          [[ "$SOURCE_PAGES" =~ ^[0-9]+$ ]] && (( SOURCE_PAGES >= 1 && SOURCE_PAGES <= 20 )) || exit 2
          [[ "$DC_DETAIL_BUDGET" =~ ^[0-9]+$ ]] && (( DC_DETAIL_BUDGET >= 0 && DC_DETAIL_BUDGET <= 30 )) || exit 2
          [[ "$INSPECTION_SEED" =~ ^-?[0-9]+$ ]] || exit 2
          if [[ "$MODE" == dc ]]; then
            python -m tools.audit_dc_sources --max-details "$DC_DETAIL_BUDGET" --inspection-seed "$INSPECTION_SEED" --output output/dc-source-audit.json --allow-partial
            exit 0
          fi
          case "$MODE" in
            free|jobicy|muse|reliefweb|usajobs) sources="$MODE" ;;
            remotive) sources=remotive ;;
            brave) sources=brave ;;
            both) sources=brave,remotive ;;
            *) exit 2 ;;
          esac
          paid_args=()
          if [[ "$sources" == *brave* ]]; then
            [[ "$ALLOW_PAID_SEARCH" == true ]] || { echo "Brave charges not authorized"; exit 2; }
            [[ -n "$BRAVE_API_KEY" ]] || { echo "BRAVE_API_KEY secret missing"; exit 2; }
            paid_args+=(--allow-paid-search)
          fi
          python -m career_engine --sources "$sources" --source-pages "$SOURCE_PAGES" --query-budget "$BUDGET" --max-extract "$EXTRACT_BUDGET" "${paid_args[@]}" --db data/live.db --output output/live_brief.md
      - name: Expand public ATS discovery without replacing the five-source audit
        if: ${{ always() && !cancelled() && inputs.source_mode == 'dc' && inputs.expanded_ats }}
        env:
          ATS_BOARD_BUDGET: ${{ inputs.ats_board_budget }}
          SEED_QUERIES: ${{ inputs.source_pages }}
          EXTRA_DETAILS: ${{ inputs.dc_detail_budget }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.expand_ats --base output/dc-source-audit.json --registry data/ats-registry.json --output-dir output/ats-discovery --combined-output output/dc-expanded-audit.json --board-budget "$ATS_BOARD_BUDGET" --seed-queries "$SEED_QUERIES" --extra-details "$EXTRA_DETAILS" --strategy regional
      - name: Report collection health independently of ranking
        if: ${{ always() && !cancelled() && inputs.source_mode == 'dc' }}
        env:
          EXPANDED_ATS: ${{ inputs.expanded_ats }}
        shell: bash
        run: |
          args=()
          if [[ "$EXPANDED_ATS" == true ]]; then args+=(--expanded output/dc-expanded-audit.json); fi
          python -m tools.summarize_collection --base output/dc-source-audit.json "${args[@]}" --output output/collection-status.json
      - name: Publish experimental ranking from the existing DC audit
        if: ${{ always() && !cancelled() && inputs.source_mode == 'dc' && inputs.experimental_ranking }}
        env:
          INSPECTION_SEED: ${{ inputs.inspection_seed }}
          EXPANDED_ATS: ${{ inputs.expanded_ats }}
        shell: bash
        run: |
          set -euo pipefail
          audit_input=output/dc-source-audit.json
          if [[ "${EXPANDED_ATS:-false}" == true && -f output/dc-expanded-audit.json ]]; then
            audit_input=output/dc-expanded-audit.json
          fi
          python -m tools.publish_experimental --input "$audit_input" --output-dir output/experimental-ranking --seed "$INSPECTION_SEED"
          cat output/experimental-ranking/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-report-${{ github.run_id }}
          path: |
            output/live_brief.md
            output/live_brief.csv
            output/screening_audit.csv
            output/discovery_metrics.json
            output/dc-source-audit.json
            output/dc-source-audit.csv
            output/dc-source-audit.md
            output/coverage-audit.json
            output/coverage-audit.csv
            output/coverage-audit.md
            output/collection-status.json
            output/collection-status.md
            output/experimental-ranking/
            output/ats-discovery/
            output/dc-expanded-audit.json
            output/dc-expanded-audit.csv
            output/dc-expanded-audit.md
          if-no-files-found: warn
          retention-days: 30
      - name: Save history
        if: success() && inputs.source_mode != 'dc'
        uses: actions/upload-artifact@v4
        with:
          name: career-history
          path: data/live.db
          if-no-files-found: error
          retention-days: 90

      - name: Save discovered ATS registry for future manual runs
        if: always() && inputs.source_mode == 'dc' && inputs.expanded_ats
        uses: actions/upload-artifact@v4
        with:
          name: public-ats-registry
          path: data/ats-registry.json
          if-no-files-found: warn
          retention-days: 90
